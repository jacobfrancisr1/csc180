<!DOCTYPE html>
<html>
  <head>
    <title>Schedule Results</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-dark text-light">
    <div class="container py-5">
      <h1 class="text-center mb-4">Generated Schedule</h1>

      <div class="text-end mb-3">
        <a href="/download" class="btn btn-success">Download Raw Text</a>
        <a href="/" class="btn btn-secondary">Back</a>
      </div>

      <div class="table-responsive">{{ table|safe }}</div>

      <h3 class="mt-5">Raw Output</h3>
      <pre class="bg-black p-3 text-warning">{{ raw_output }}</pre>
    </div>
  </body>
</html>
