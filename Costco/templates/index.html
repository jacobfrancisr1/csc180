<!DOCTYPE html>
<html>
  <head>
    <title>Costco Scheduler</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-dark text-light">
    <div class="container py-5">
      <h1 class="text-center mb-4">Costco Night Merch Scheduler</h1>

      {% with messages = get_flashed_messages() %} {% if messages %}
      <div class="alert alert-info">{{ messages[0] }}</div>
      {% endif %} {% endwith %}

      <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
        class="mb-4"
      >
        <div class="row">
          <div class="col">
            <label>Employee Skills CSV</label>
            <input type="file" name="skills" class="form-control" />
          </div>
          <div class="col">
            <label>Weekly Schedule CSV</label>
            <input type="file" name="schedule" class="form-control" />
          </div>
        </div>
        <button class="btn btn-warning mt-3">Upload</button>
      </form>

      <a href="/run" class="btn btn-primary btn-lg">Run Scheduler</a>
    </div>
  </body>
</html>
